name: Holmes Build and Push
on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: uhub.service.ucloud.cn
          username: ${{ secrets.UHUB_USERNAME }}
          password: ${{ secrets.UHUB_PASSWORD }}
      - run: |
          docker build -t uhub.service.ucloud.cn/holmes/holmes-api:latest \
                       -t uhub.service.ucloud.cn/holmes/holmes-api:${{ github.sha }} ./server
          docker push uhub.service.ucloud.cn/holmes/holmes-api:latest
          docker push uhub.service.ucloud.cn/holmes/holmes-api:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: uhub.service.ucloud.cn
          username: ${{ secrets.UHUB_USERNAME }}
          password: ${{ secrets.UHUB_PASSWORD }}
      - run: |
          docker build -t uhub.service.ucloud.cn/holmes/holmes-web:latest \
                       -t uhub.service.ucloud.cn/holmes/holmes-web:${{ github.sha }} .
          docker push uhub.service.ucloud.cn/holmes/holmes-web:latest            
          docker push uhub.service.ucloud.cn/holmes/holmes-web:${{ github.sha }}
